<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Gallery</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css?v=3">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-layer" id="bg-layer"></div>
    <div class="overlay-pattern"></div>

    <button class="view-toggle-btn" id="toggle-view-btn" aria-label="הצג רשימה">
        <svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
        <span>רשימה מלאה</span>
    </button>

    <div class="main-stage">
        <header>
            <div class="brand">MY SPACE</div>
            <h1>האזור האישי</h1>
        </header>

        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="swiper-wrapper">
                </div>
            
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <div class="list-overlay" id="list-overlay">
        <div class="list-header">
            <h2>כל הסרטונים</h2>
            <button class="close-list-btn" id="close-list-btn">✕</button>
        </div>
        <div class="grid-container" id="grid-container">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
