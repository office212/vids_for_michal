<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibrant Cinema</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css?v=5">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-layer active" id="bg-1"></div>
    <div class="bg-layer" id="bg-2"></div>
    
    <div class="overlay-texture"></div>

    <button class="view-toggle-btn" id="toggle-view-btn">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
        <span>ספרייה</span>
    </button>

    <div class="main-stage">
        <header>
            <div class="brand">MY COLLECTION</div>
            <h1>האזור האישי</h1>
        </header>

        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="swiper-wrapper">
                </div>
            
            <div class="swiper-pagination"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    </div>

    <div class="list-overlay" id="list-overlay">
        <div class="list-header">
            <h2>כל הסרטונים</h2>
            <button class="close-list-btn" id="close-list-btn">✕</button>
        </div>
        <div class="grid-container" id="grid-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js?v=5"></script>
</body>
</html>
